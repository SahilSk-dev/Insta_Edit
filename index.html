<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Direct" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Instagram Direct</title>
    <style>
      /* Bengali Custom Fonts */
      @font-face {
        font-family: 'FL Bonolota';
        src: url('/fonts/FL Bonolota Special Unicode.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'FL Bonolota';
        src: url('/fonts/FL Bonolota Special Unicode Italic.ttf') format('truetype');
        font-weight: normal;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'FL Chirkut';
        src: url('/fonts/FL Chirkut Aksharangana Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'FL Chirkut';
        src: url('/fonts/FL Chirkut Aksharangana Italic.ttf') format('truetype');
        font-weight: normal;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'FL Chirkut Special';
        src: url('/fonts/FL Chirkut Special Modifie.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'FL Mahfuj Isahak';
        src: url('/fonts/FL Mahfuj Isahak Unicode.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'FL Mahfuj Isahak';
        src: url('/fonts/FL Mahfuj Isahak Unicode Italic.ttf') format('truetype');
        font-weight: normal;
        font-style: italic;
        font-display: swap;
      }

      /* Unicode Extended & Stylized Script Fonts */
      @font-face {
        font-family: 'Noto Sans';
        src: url('/fonts/NotoSans.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans Math';
        src: url('/fonts/NotoSansMath.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans Meetei Mayek';
        src: url('/fonts/NotoSansMeeteiMayek.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Music';
        src: url('/fonts/NotoMusic.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans Anatolian Hieroglyphs';
        src: url('/fonts/NotoSansAnatolianHieroglyphs.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans Javanese';
        src: url('/fonts/NotoSansJavanese.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans Hebrew';
        src: url('/fonts/NotoSansHebrew.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans Ethiopic';
        src: url('/fonts/NotoSansEthiopic.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans Symbols';
        src: url('/fonts/NotoSansSymbols.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans Symbols 2';
        src: url('/fonts/NotoSansSymbols2.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Color Emoji Custom';
        src: url('/fonts/NotoColorEmoji.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "Noto Sans", "Noto Sans Math", "Noto Sans Meetei Mayek", "Noto Music",
          "Noto Sans Anatolian Hieroglyphs", "Noto Sans Javanese", "Noto Sans Hebrew", "Noto Sans Ethiopic",
          "Noto Sans Symbols", "Noto Sans Symbols 2",
          "FL Bonolota", "FL Chirkut", "FL Chirkut Special", "FL Mahfuj Isahak",
          "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji Custom", "Noto Color Emoji", "Segoe UI Symbol", sans-serif;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }

      input, textarea, button, select {
        font-family: inherit;
      }

      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Completely hide all scrollbars across mobile and desktop */
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar,
      ::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
