<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahil Editor Aesthetic Neon Keyboard Frame</title>

  <!-- Custom Font: Ghost Theory 2 -->
  <style>
    @font-face {
      font-family: 'Ghost Theory 2';
      src: url('Ghost_theory_2.ttf') format('truetype'),
           url('file:///C:/Users/sahil/Downloads/Fonts/Ghost%20theory%202.ttf') format('truetype'),
           url('file:///C:/Users/sahil/Documents/10_Sahil_Workspace/Insta_Edit/Ghost_theory_2.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  </style>

  <!-- Google Fonts: Elegant Calligraphy & Fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;800&family=Outfit:wght@500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #07090e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      padding: 20px;
    }

    /* Action Control Toolbar */
    .toolbar-actions {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      z-index: 100;
    }

    .btn-action {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #00f0ff;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.25);
      transition: all 0.25s ease;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 240, 255, 0.5);
      border-color: #ff007f;
      background: linear-gradient(135deg, #2a1b3d, #140b24);
    }

    .btn-action.transparent {
      border-color: #e040fb;
      box-shadow: 0 4px 15px rgba(224, 64, 251, 0.25);
    }

    .btn-action.transparent:hover {
      box-shadow: 0 6px 25px rgba(224, 64, 251, 0.5);
    }

    /* Main Keyboard Frame Container */
    .keyboard-canvas-wrapper {
      position: relative;
      background: #000000;
      width: 100%;
      max-width: 720px;
      padding: 18px 16px 24px 16px;
      border-radius: 28px;
      border: 2px solid rgba(0, 229, 255, 0.2);
      box-shadow: 
        0 0 35px rgba(0, 0, 0, 0.95),
        0 0 50px rgba(0, 229, 255, 0.12),
        inset 0 0 30px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    /* 1. TOP HEADER BAR */
    .keyboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      margin-bottom: 2px;
    }

    .nav-arrow-left, .nav-arrow-right {
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
      transition: transform 0.2s;
    }

    .nav-arrow-left:hover, .nav-arrow-right:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 6px #00f0ff);
    }

    /* Center Pill: Sahil Editor */
    .pill-title-container {
      position: relative;
      flex: 1;
      max-width: 480px;
      margin: 0 16px;
      height: 48px;
      border-radius: 26px;
      border: 1.8px solid transparent;
      background: linear-gradient(#000000, #000000) padding-box,
                  linear-gradient(90deg, #ff007f 0%, #8a2be2 40%, #00e5ff 100%) border-box;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(255, 0, 127, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }

    .crown-top-pill {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      filter: drop-shadow(0 0 6px #ffd700);
      z-index: 5;
    }

    .pill-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .flourish-left {
      width: 32px;
      height: 12px;
      background: radial-gradient(circle, #ff007f 10%, transparent 70%);
      position: relative;
    }

    .flourish-left::before {
      content: '〰';
      position: absolute;
      left: 0;
      top: -12px;
      font-size: 20px;
      color: #ff00aa;
      filter: drop-shadow(0 0 4px #ff00aa);
    }

    .editor-title-text {
      font-family: 'Ghost Theory 2', 'Alex Brush', cursive;
      font-size: 34px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1.5px;
      text-shadow: 
        0 0 6px rgba(255, 255, 255, 0.9),
        0 0 12px #00e5ff,
        0 0 20px #8a2be2;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .messenger-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, #0084ff 0%, #0056cc 100%);
      box-shadow: 0 0 10px #0084ff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
    }

    .messenger-badge svg {
      width: 17px;
      height: 17px;
      fill: #ffffff;
    }

    /* 2. SUB-HEADER TOOLBAR (Instagram + SAHIL Logo + S Badge) */
    .sub-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      margin-bottom: 4px;
    }

    .sub-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Glowing Instagram Circle */
    .insta-glow-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      padding: 2px;
      background: conic-gradient(from 45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888, #8a2be2, #00f0ff, #f09433);
      box-shadow: 0 0 14px rgba(220, 39, 67, 0.8), 0 0 8px rgba(0, 240, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .insta-glow-badge-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .insta-glow-badge svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    /* Neon Green SAHIL Signature */
    .sahil-neon-sig {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.8);
      padding: 3px 10px;
      border-radius: 16px;
      border-bottom: 2px solid #00ff88;
      box-shadow: 0 2px 10px rgba(0, 255, 136, 0.3);
    }

    .sig-butterfly {
      font-size: 20px;
      filter: drop-shadow(0 0 6px #00ff88);
    }

    .sig-text {
      font-family: 'Ghost Theory 2', 'Cinzel', serif;
      font-weight: 800;
      font-size: 20px;
      color: #00ff88;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00ff88, 0 0 16px #00cc66;
    }

    .sig-crown-badge {
      font-size: 20px;
      filter: drop-shadow(0 0 8px #00ff88);
    }

    /* Center Cursor Indicator */
    .center-cursor-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 8px #ffffff;
    }

    .center-cursor-indicator span {
      font-size: 13px;
      opacity: 0.8;
    }

    /* Right Red Crown S Badge */
    .right-s-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, #200005 30%, #000000 100%);
      border: 2px solid #ff0044;
      box-shadow: 0 0 14px #ff0044, inset 0 0 8px rgba(255, 0, 68, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .badge-crown-mini {
      position: absolute;
      top: -8px;
      font-size: 11px;
      filter: drop-shadow(0 0 4px #ffd700);
    }

    .badge-s-letter {
      font-family: 'Ghost Theory 2', cursive;
      font-size: 28px;
      font-weight: bold;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 6px #ffffff, 0 0 12px #ff0044;
    }

    /* 3. KEYBOARD MATRIX GRID */
    .keyboard-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 4px;
    }

    .key-row {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      width: 100%;
    }

    /* Standard Keycap Style */
    .key-cap {
      flex: 1;
      height: 60px;
      background: #000000;
      border-radius: 10px;
      border: 1.5px solid rgba(45, 95, 255, 0.45);
      box-shadow: 
        0 0 6px rgba(45, 95, 255, 0.3),
        inset 0 0 8px rgba(20, 50, 160, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 5px 2px;
      cursor: pointer;
      position: relative;
      transition: all 0.12s ease;
    }

    .key-cap:hover, .key-cap:active {
      transform: translateY(-2px) scale(1.04);
      border-color: #00e5ff;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.8), inset 0 0 12px rgba(0, 229, 255, 0.4);
      background: #060e1f;
    }

    /* Top Sub-Character (Number or Symbol) */
    .sub-char {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1;
    }

    /* Main Letter Character with Ghost Theory 2 */
    .main-char {
      font-family: 'Ghost Theory 2', 'MedievalSharp', 'Poppins', serif;
      font-size: 24px;
      font-weight: normal;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.9), 0 0 10px rgba(0, 229, 255, 0.4);
      letter-spacing: -0.5px;
    }

    /* SPECIAL HIGHLIGHTED NEON KEYS (S - A - H - I - L) */
    .key-cap.sahil-s {
      border: 2px solid #2979ff;
      box-shadow: 0 0 14px #2962ff, inset 0 0 10px rgba(41, 98, 255, 0.5);
    }
    .key-cap.sahil-s .main-char {
      text-shadow: 0 0 6px #ffffff, 0 0 14px #2979ff;
      font-family: 'Ghost Theory 2', sans-serif;
      font-size: 28px;
    }

    .key-cap.sahil-a {
      border: 2px solid #ea80fc;
      box-shadow: 0 0 15px #e040fb, inset 0 0 10px rgba(224, 64, 251, 0.5);
    }
    .key-cap.sahil-a .main-char {
      text-shadow: 0 0 6px #ffffff, 0 0 14px #ea80fc;
      font-family: 'Ghost Theory 2', sans-serif;
      font-size: 28px;
    }

    .key-cap.sahil-h {
      border: 2px solid #18ffff;
      box-shadow: 0 0 15px #00e5ff, inset 0 0 10px rgba(0, 229, 255, 0.5);
    }
    .key-cap.sahil-h .main-char {
      text-shadow: 0 0 6px #ffffff, 0 0 14px #18ffff;
      font-family: 'Ghost Theory 2', sans-serif;
      font-size: 28px;
    }

    .key-cap.sahil-i {
      border: 2px solid #ff5252;
      box-shadow: 0 0 15px #ff1744, inset 0 0 10px rgba(255, 23, 68, 0.5);
    }
    .key-cap.sahil-i .main-char {
      text-shadow: 0 0 6px #ffffff, 0 0 14px #ff5252;
      font-family: 'Ghost Theory 2', sans-serif;
      font-size: 28px;
    }

    .key-cap.sahil-l {
      border: 2px solid #536dfe;
      box-shadow: 0 0 15px #3d5afe, inset 0 0 10px rgba(61, 90, 254, 0.5);
    }
    .key-cap.sahil-l .main-char {
      text-shadow: 0 0 6px #ffffff, 0 0 14px #536dfe;
      font-family: 'Ghost Theory 2', sans-serif;
      font-size: 28px;
    }

    /* Row 3 Special Keys (Shift & Backspace) */
    .key-cap.key-shift {
      flex: 1.15;
      justify-content: center;
      align-items: center;
    }

    .shift-arrow-icon {
      font-size: 22px;
      color: #ffffff;
      filter: drop-shadow(0 0 6px #ffffff);
    }

    .key-cap.key-backspace {
      flex: 1.15;
      justify-content: center;
      align-items: center;
    }

    .backspace-icon svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
      filter: drop-shadow(0 0 6px #ffffff);
    }

    /* Row 4: Spacebar & Bottom Keys */
    .key-cap.key-space {
      flex: 5.5;
      height: 48px;
      margin-top: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .space-glow-line {
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00f0ff, transparent);
      border-radius: 2px;
      box-shadow: 0 0 8px #00f0ff;
    }

    /* Live Typed Output Preview */
    .typed-live-box {
      width: 100%;
      max-width: 720px;
      margin-top: 20px;
      background: #090c14;
      border: 1px solid #1f2838;
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .typed-text-display {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      color: #00f0ff;
      letter-spacing: 1px;
      min-height: 28px;
      display: flex;
      align-items: center;
    }

    .btn-clear {
      background: #1f2430;
      border: 1px solid #3b4252;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>

  <!-- html2canvas for Ultra-HD PNG Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- Top Action Toolbar -->
  <div class="toolbar-actions">
    <button class="btn-action" onclick="exportKeyboardPNG(false)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Download HD PNG (Dark BG)
    </button>
    <button class="btn-action transparent" onclick="exportKeyboardPNG(true)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Download HD PNG (Transparent)
    </button>
  </div>

  <!-- MAIN KEYBOARD FRAME CONTAINER -->
  <div class="keyboard-canvas-wrapper" id="keyboardFrame">

    <!-- 1. TOP HEADER BAR -->
    <header class="keyboard-header">
      <!-- Left Chevron -->
      <div class="nav-arrow-left">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>

      <!-- Center Pill: Sahil Editor -->
      <div class="pill-title-container">
        <div class="crown-top-pill">👑</div>
        <div class="pill-content">
          <div class="flourish-left"></div>
          <div class="editor-title-text">
            Sahil Editor
          </div>
          <div class="messenger-badge">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.03 2 11c0 2.87 1.48 5.43 3.8 7.04V21l3.03-1.66c1.01.28 2.07.43 3.17.43 5.52 0 10-4.03 10-9s-4.48-9-10-9zm1.06 12.15l-2.61-2.78-5.1 2.78 5.61-5.95 2.68 2.78 5.03-2.78-5.61 5.95z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Right Share Arrow -->
      <div class="nav-arrow-right">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </div>
    </header>

    <!-- 2. SUB-HEADER TOOLBAR -->
    <section class="sub-toolbar">
      <!-- Left: Instagram Logo + SAHIL Signature -->
      <div class="sub-left">
        <!-- Glowing Instagram Badge -->
        <div class="insta-glow-badge">
          <div class="insta-glow-badge-inner">
            <svg viewBox="0 0 24 24">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </div>
        </div>

        <!-- Neon Green SAHIL Signature with Butterfly -->
        <div class="sahil-neon-sig">
          <span class="sig-butterfly">🦋</span>
          <span class="sig-text">SAHIL</span>
          <span class="sig-crown-badge">👑</span>
        </div>
      </div>

      <!-- Center Cursor Indicator -->
      <div class="center-cursor-indicator">
        <span>◂</span> I <span>▸</span>
      </div>

      <!-- Right Red Crown S Badge -->
      <div class="right-s-badge">
        <span class="badge-crown-mini">👑</span>
        <span class="badge-s-letter">S</span>
      </div>
    </section>

    <!-- 3. KEYBOARD MATRIX -->
    <main class="keyboard-grid">

      <!-- ROW 1 (10 Keys: 1-Q to 0-P) -->
      <div class="key-row">
        <div class="key-cap" onclick="pressKey('Q')"><span class="sub-char">1</span><span class="main-char">Q</span></div>
        <div class="key-cap" onclick="pressKey('W')"><span class="sub-char">2</span><span class="main-char">W</span></div>
        <div class="key-cap" onclick="pressKey('E')"><span class="sub-char">3</span><span class="main-char">E</span></div>
        <div class="key-cap" onclick="pressKey('R')"><span class="sub-char">4</span><span class="main-char">R</span></div>
        <div class="key-cap" onclick="pressKey('T')"><span class="sub-char">5</span><span class="main-char">T</span></div>
        <div class="key-cap" onclick="pressKey('Y')"><span class="sub-char">6</span><span class="main-char">Y</span></div>
        <div class="key-cap" onclick="pressKey('U')"><span class="sub-char">7</span><span class="main-char">U</span></div>
        <div class="key-cap" onclick="pressKey('I')"><span class="sub-char">8</span><span class="main-char">I</span></div>
        <div class="key-cap" onclick="pressKey('O')"><span class="sub-char">9</span><span class="main-char">O</span></div>
        <div class="key-cap" onclick="pressKey('P')"><span class="sub-char">0</span><span class="main-char">P</span></div>
      </div>

      <!-- ROW 2 (9 Keys: Glowing SAHIL + H, J, K, L) -->
      <div class="key-row">
        <!-- Glowing S -->
        <div class="key-cap sahil-s" onclick="pressKey('S')">
          <span class="sub-char">#</span>
          <span class="main-char">S</span>
        </div>
        <!-- Glowing A -->
        <div class="key-cap sahil-a" onclick="pressKey('A')">
          <span class="sub-char">@</span>
          <span class="main-char">A</span>
        </div>
        <!-- Glowing H -->
        <div class="key-cap sahil-h" onclick="pressKey('H')">
          <span class="sub-char">!</span>
          <span class="main-char">H</span>
        </div>
        <!-- Glowing I -->
        <div class="key-cap sahil-i" onclick="pressKey('I')">
          <span class="sub-char">&amp;</span>
          <span class="main-char">I</span>
        </div>
        <!-- Glowing L -->
        <div class="key-cap sahil-l" onclick="pressKey('L')">
          <span class="sub-char">)</span>
          <span class="main-char">L</span>
        </div>
        <!-- Normal H -->
        <div class="key-cap" onclick="pressKey('H')">
          <span class="sub-char">!</span>
          <span class="main-char">H</span>
        </div>
        <!-- Normal J -->
        <div class="key-cap" onclick="pressKey('J')">
          <span class="sub-char">?</span>
          <span class="main-char">J</span>
        </div>
        <!-- Normal K -->
        <div class="key-cap" onclick="pressKey('K')">
          <span class="sub-char">(</span>
          <span class="main-char">K</span>
        </div>
        <!-- Normal L -->
        <div class="key-cap" onclick="pressKey('L')">
          <span class="sub-char">)</span>
          <span class="main-char">L</span>
        </div>
      </div>

      <!-- ROW 3 (Shift + Z X C V B N M + Backspace) -->
      <div class="key-row">
        <!-- Shift Key -->
        <div class="key-cap key-shift" onclick="pressKey('⇧')">
          <span class="shift-arrow-icon">⬆</span>
        </div>

        <div class="key-cap" onclick="pressKey('Z')"><span class="sub-char"></span><span class="main-char">Z</span></div>
        <div class="key-cap" onclick="pressKey('X')"><span class="sub-char"></span><span class="main-char">X</span></div>
        <div class="key-cap" onclick="pressKey('C')"><span class="sub-char"></span><span class="main-char">C</span></div>
        <div class="key-cap" onclick="pressKey('V')"><span class="sub-char"></span><span class="main-char">V</span></div>
        <div class="key-cap" onclick="pressKey('B')"><span class="sub-char"></span><span class="main-char">B</span></div>
        <div class="key-cap" onclick="pressKey('N')"><span class="sub-char">:</span><span class="main-char">N</span></div>
        <div class="key-cap" onclick="pressKey('M')"><span class="sub-char">/</span><span class="main-char">M</span></div>

        <!-- Backspace Key -->
        <div class="key-cap key-backspace" onclick="pressBackspace()">
          <span class="backspace-icon">
            <svg viewBox="0 0 24 24">
              <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- ROW 4: Spacebar -->
      <div class="key-row" style="justify-content: center;">
        <div class="key-cap key-space" onclick="pressKey(' ')">
          <div class="space-glow-line"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- Interactive Typed Text Output -->
  <div class="typed-live-box">
    <div class="typed-text-display" id="typedOutput">SAHIL</div>
    <button class="btn-clear" onclick="clearOutput()">Clear</button>
  </div>

  <!-- Script for Interactive Typing & High-Res PNG Export -->
  <script>
    let typedText = "SAHIL";
    const outputEl = document.getElementById('typedOutput');

    function pressKey(char) {
      if (char === '⇧') return;
      typedText += char;
      outputEl.textContent = typedText;
    }

    function pressBackspace() {
      typedText = typedText.slice(0, -1);
      outputEl.textContent = typedText;
    }

    function clearOutput() {
      typedText = "";
      outputEl.textContent = typedText;
    }

    // High-Res PNG Exporter (4x DPI Ultra-HD)
    function exportKeyboardPNG(transparent = false) {
      const frame = document.getElementById('keyboardFrame');
      
      const originalBorder = frame.style.border;
      const originalShadow = frame.style.boxShadow;
      const originalBg = frame.style.background;

      if (transparent) {
        frame.style.background = 'transparent';
      }

      html2canvas(frame, {
        scale: 4, // 4x Resolution (Crystal Clear 4K Quality)
        backgroundColor: transparent ? null : '#000000',
        useCORS: true,
        logging: false
      }).then(canvas => {
        // Restore styles
        frame.style.background = originalBg;

        // Download PNG
        const link = document.createElement('a');
        link.download = transparent ? 'Sahil_Keyboard_Transparent.png' : 'Sahil_Keyboard_HD.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        console.error("Export Error:", err);
        alert("Export failed: " + err);
      });
    }
  </script>
</body>
</html>
